version: '3.8'

services:
  postgres:
    image: postgres:18-alpine
    container_name: educariera-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: educariera
      POSTGRES_PASSWORD: educariera_secret
      POSTGRES_DB: educariera_db
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U educariera -d educariera_db"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: educariera-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  pgdata:
  redisdata:
